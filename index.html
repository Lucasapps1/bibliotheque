<!-- Manifest inline via JS (no external file needed) -->

<script>
(function(){
  const icon = generateIcon();
  const manifest = {
    name: "Ma Bibliothèque",
    short_name: "Bibliothèque",
    description: "Gestion de bibliothèque personnelle",
    start_url: ".",
    display: "standalone",
    background_color: "#faf7f2",
    theme_color: "#1a1208",
    orientation: "portrait",
    icons: [
      { src: icon, sizes: "192x192", type: "image/png" },
      { src: icon, sizes: "512x512", type: "image/png" }
    ]
  };
  const blob = new Blob([JSON.stringify(manifest)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const link = document.createElement('link');
  link.rel = 'manifest'; link.href = url;
  document.head.appendChild(link);

  // Apple touch icon
  const iconLink = document.createElement('link');
  iconLink.rel = 'apple-touch-icon';
  iconLink.href = icon;
  document.head.appendChild(iconLink);

  function generateIcon() {
    const c = document.createElement('canvas');
    c.width = 512; c.height = 512;
    const ctx = c.getContext('2d');
    // Background
    ctx.fillStyle = '#1a1208';
    roundRect(ctx, 0, 0, 512, 512, 80);
    ctx.fill();
    // Gold band top
    ctx.fillStyle = '#b8860b';
    ctx.fillRect(0, 80, 512, 8);
    ctx.fillRect(0, 424, 512, 8);
    // Book spines
    const colors = ['#8b3a2a','#4a5c4e','#b8860b','#2d4a6e'];
    const widths = [70,55,80,60];
    let x = 96;
    widths.forEach((w,i)=>{
      ctx.fillStyle = colors[i];
      roundRect(ctx, x, 120, w, 280, 6);
      ctx.fill();
      ctx.fillStyle = 'rgba(255,255,255,0.15)';
      ctx.fillRect(x+8, 140, 4, 240);
      x += w + 18;
    });
    // Title text
    ctx.fillStyle = '#d4a843';
    ctx.font = 'bold 48px serif';
    ctx.textAlign = 'center';
    ctx.fillText('Ma', 256, 460);
    return c.toDataURL('image/png');
  }
  function roundRect(ctx, x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x+r, y);
    ctx.lineTo(x+w-r, y);
    ctx.quadraticCurveTo(x+w, y, x+w, y+r);
    ctx.lineTo(x+w, y+h-r);
    ctx.quadraticCurveTo(x+w, y+h, x+w-r, y+h);
    ctx.lineTo(x+r, y+h);
    ctx.quadraticCurveTo(x, y+h, x, y+h-r);
    ctx.lineTo(x, y+r);
    ctx.quadraticCurveTo(x, y, x+r, y);
    ctx.closePath();
  }
})();
</script>

];

let books = JSON.parse(localStorage.getItem('biblio_books') || 'null') || INITIAL_BOOKS;
let editingId = null;
let currentImageBase64 = null;

function save() { localStorage.setItem('biblio_books', JSON.stringify(books)); }

function getFiltered() {
  const q = document.getElementById('search-input').value.toLowerCase().trim();
  const status = document.getElementById('filter-status').value;
  const year = document.getElementById('filter-year').value;
  return books.filter(b => {
    const mQ = !q || b.title.toLowerCase().includes(q) || b.author.toLowerCase().includes(q);
    const mS = status==='all' || (status==='read'&&b.read) || (status==='unread'&&!b.read);
    const mY = year==='all' || String(b.readYear)===year;
    return mQ&&mS&&mY;
  });
}

function render() {
  const list = document.getElementById('book-list');
  const filtered = getFiltered();
  updateStats(); updateYearFilter();
  document.getElementById('results-label').textContent = filtered.length===books.length
    ? `Tous les ouvrages (${books.length})`
    : `${filtered.length} résultat${filtered.length!==1?'s':''}`;
  if(!filtered.length){list.innerHTML=`<div class="no-results">Aucun ouvrage trouvé.</div>`;return;}
  list.innerHTML = filtered.map(b=>`
    <div class="book-card ${b.read?'is-read':'not-read'}">
      <div class="book-inner">
        ${b.cover?`<img class="book-cover-thumb" src="${b.cover}" alt="Couverture">`:''}
        <div class="book-main">
          <div class="book-title">${esc(b.title)}</div>
          <div class="book-author">${esc(b.author)}</div>
          <div class="book-meta">
            ${b.publisher?`<span class="tag tag-publisher">${esc(b.publisher)}</span>`:''}
            ${b.lang?`<span class="tag tag-lang">${esc(b.lang)}</span>`:''}
            ${b.pubYear?`<span class="tag tag-year">${b.pubYear}</span>`:''}
            ${b.read?`<span class="tag tag-read">✓ Lu${b.readYear?' en '+b.readYear:''}</span>`:`<span class="tag tag-unread">À lire</span>`}
          </div>
          ${b.summary?`<div class="book-summary">${esc(b.summary)}</div>`:''}
        </div>
      </div>
      <div class="book-actions">
        <button class="read-toggle" onclick="toggleRead(${b.id})">${b.read?'✓ Lu':'○ Marquer lu'}</button>
        <button class="btn btn-sm" style="background:var(--parchment);border:1.5px solid var(--border)" onclick="editBook(${b.id})">Éditer</button>
        <button class="btn btn-sm btn-danger" onclick="deleteBook(${b.id})">Suppr.</button>
      </div>
    </div>`).join('');
}

function updateStats() {
  const r = books.filter(b=>b.read).length;
  document.getElementById('stat-total').textContent = books.length;
  document.getElementById('stat-read').textContent = r;
  document.getElementById('stat-unread').textContent = books.length-r;
}
function updateYearFilter() {
  const sel = document.getElementById('filter-year');
  const cur = sel.value;
  const yrs = [...new Set(books.filter(b=>b.readYear).map(b=>b.readYear))].sort((a,b)=>b-a);
  sel.innerHTML = '<option value="all">Toutes années</option>'+yrs.map(y=>`<option value="${y}"${String(y)===cur?' selected':''}>${y}</option>`).join('');
}

function toggleRead(id) {
  const b = books.find(b=>b.id===id); if(!b) return;
  b.read=!b.read;
  if(b.read&&!b.readYear) b.readYear=new Date().getFullYear();
  if(!b.read) b.readYear=null;
  save(); render();
}
function deleteBook(id) {
  if(!confirm('Supprimer cet ouvrage ?')) return;
  books=books.filter(b=>b.id!==id); save(); render();
}

function openModal(book=null) {
  editingId=book?book.id:null; currentImageBase64=null;
  document.getElementById('modal-title').textContent = book?"Modifier l'ouvrage":"Ajouter un ouvrage";
  document.getElementById('f-title').value=book?.title||'';
  document.getElementById('f-author').value=book?.author||'';
  document.getElementById('f-publisher').value=book?.publisher||'';
  document.getElementById('f-lang').value=book?.lang||'Français';
  document.getElementById('f-pub-year').value=book?.pubYear||'';
  document.getElementById('f-read-year').value=book?.readYear||'';
  document.getElementById('f-read').checked=book?.read||false;
  document.getElementById('f-summary').value=book?.summary||'';
  const isEdit=!!book;
  document.getElementById('scan-section').style.display=isEdit?'none':'block';
  document.getElementById('modal-divider').style.display=isEdit?'none':'flex';
  clearScan();
  document.getElementById('modal-overlay').classList.add('open');
}
function editBook(id){openModal(books.find(b=>b.id===id));}
function closeModal(){document.getElementById('modal-overlay').classList.remove('open');editingId=null;}

function saveBook() {
  const title=document.getElementById('f-title').value.trim();
  const author=document.getElementById('f-author').value.trim();
  if(!title||!author){alert('Titre et auteur sont requis.');return;}
  const data={
    title,author,
    publisher:document.getElementById('f-publisher').value.trim(),
    lang:document.getElementById('f-lang').value,
    pubYear:parseInt(document.getElementById('f-pub-year').value)||null,
    readYear:parseInt(document.getElementById('f-read-year').value)||null,
    read:document.getElementById('f-read').checked,
    summary:document.getElementById('f-summary').value.trim(),
    cover:currentImageBase64||(editingId?books.find(b=>b.id===editingId)?.cover:null)||null
  };
  if(editingId){const i=books.findIndex(b=>b.id===editingId);books[i]={...books[i],...data};}
  else{data.id=Date.now();books.push(data);}
  save();closeModal();render();
}

/* ─── PHOTO SCAN ─── */
function onFileChosen(e) {
  const file=e.target.files[0]; if(!file) return;
  const reader=new FileReader();
  reader.onload=ev=>{
    const url=ev.target.result;
    currentImageBase64=url;
    document.getElementById('preview-img').src=url;
    document.getElementById('preview-name').textContent=file.name;
    document.getElementById('preview-size').textContent=(file.size/1024).toFixed(0)+' Ko';
    document.getElementById('scan-preview').classList.add('visible');
    document.getElementById('scan-zone').style.display='none';
    document.getElementById('scan-btn').disabled=false;
    setStatus('','');
  };
  reader.readAsDataURL(file);
}

function clearScan() {
  currentImageBase64=null;
  document.getElementById('cover-file').value='';
  document.getElementById('preview-img').src='';
  document.getElementById('scan-preview').classList.remove('visible');
  document.getElementById('scan-zone').style.display='block';
  document.getElementById('scan-btn').disabled=true;
  setStatus('','');
}

function setStatus(type,msg){
  const el=document.getElementById('scan-status');
  el.className='scan-status'+(type?' '+type:'');
  el.textContent=msg;
}

async function scanCover() {
  if(!currentImageBase64) return;
  const btn=document.getElementById('scan-btn');
  btn.disabled=true;
  btn.innerHTML=`<span class="spinner"></span> Analyse en cours…`;
  setStatus('loading','🔍 L\'IA lit la couverture et recherche les informations…');

  const base64Data=currentImageBase64.split(',')[1];
  const mediaType=currentImageBase64.split(';')[0].split(':')[1]||'image/jpeg';

  try {
    const resp=await fetch("https://api.anthropic.com/v1/messages",{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({
        model:"claude-sonnet-4-20250514",
        max_tokens:1000,
        messages:[{
          role:"user",
          content:[
            {type:"image",source:{type:"base64",media_type:mediaType,data:base64Data}},
            {type:"text",text:`Tu es un expert bibliothécaire. Analyse cette photo de couverture de livre.
Réponds UNIQUEMENT avec un objet JSON valide, sans markdown ni backticks, avec exactement ces champs :
{
  "title": "titre exact visible sur la couverture",
  "author": "nom complet de l'auteur visible sur la couverture",
  "publisher": "nom de l'éditeur visible sur la couverture",
  "lang": "langue du livre — UNIQUEMENT une de ces valeurs : Français, Italien, Anglais, Espagnol, Allemand, Autre",
  "pubYear": null ou année entière si visible,
  "summary": "résumé de 2-3 phrases de l'œuvre basé sur ta connaissance générale du livre"
}
Si une information n'est pas visible, mets null (nombres) ou "" (textes), sauf lang et summary que tu peux déduire.`}
          ]
        }]
      })
    });
    const data=await resp.json();
    if(!resp.ok) throw new Error(data.error?.message||'Erreur API');
    const text=data.content?.find(c=>c.type==='text')?.text||'';
    const clean=text.replace(/```json|```/g,'').trim();
    const p=JSON.parse(clean);

    if(p.title) document.getElementById('f-title').value=p.title;
    if(p.author) document.getElementById('f-author').value=p.author;
    if(p.publisher) document.getElementById('f-publisher').value=p.publisher;
    if(p.lang){const s=document.getElementById('f-lang');const o=[...s.options].find(x=>x.value===p.lang);if(o)s.value=p.lang;}
    if(p.pubYear) document.getElementById('f-pub-year').value=p.pubYear;
    if(p.summary) document.getElementById('f-summary').value=p.summary;

    setStatus('success','✓ Informations extraites ! Vérifiez et corrigez si nécessaire avant d\'enregistrer.');
  } catch(err) {
    console.error(err);
    setStatus('error','✗ Échec de l\'analyse. Veuillez saisir les informations manuellement.');
  } finally {
    btn.disabled=false;
    btn.innerHTML=`<svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="M11 8v6M8 11h6"/></svg> Analyser avec l'IA`;
  }
}

function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}

document.getElementById('search-input').addEventListener('input',render);
document.getElementById('filter-status').addEventListener('change',render);
document.getElementById('filter-year').addEventListener('change',render);
document.getElementById('modal-overlay').addEventListener('click',e=>{if(e.target===e.currentTarget)closeModal();});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal();});

// Drag & drop
const zone=document.getElementById('scan-zone');
zone.addEventListener('dragover',e=>{e.preventDefault();zone.classList.add('dragging');});
zone.addEventListener('dragleave',()=>zone.classList.remove('dragging'));
zone.addEventListener('drop',e=>{
  e.preventDefault();zone.classList.remove('dragging');
  const file=e.dataTransfer.files[0];
  if(file&&file.type.startsWith('image/')){
    onFileChosen({target:{files:[file]}});
  }
});

render();
</script>

</body>
